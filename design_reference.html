<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADAT | Service Quality & Complaints</title><style>
:root{--navy:#102d54;--blue:#416fda;--muted:#8293aa;--border:#e5ebf5;--bg:#f4f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:245px;flex-shrink:0;background:white;border-right:1px solid var(--border);padding:25px 14px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:12px;padding:0 9px}.brand img{width:49px;height:56px;object-fit:contain}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.1px;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:11px;color:#6a7e9b;font-weight:600}.nav button.active,.nav button:hover{background:#e9f0ff;color:#2e60d2}.nav button span{display:inline-block;width:28px;font-size:17px}.sidefoot{margin-top:auto;background:#f0f5ff;border-radius:13px;padding:15px;color:#7187a6;font-size:12px;line-height:1.8}.main{flex:1;min-width:0;padding:28px 38px 60px;max-width:1700px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;color:#8295ae;font-size:12px}.topright{display:flex;align-items:center;gap:12px}.lang{border:1px solid #dce6f5;background:#fff;border-radius:10px;padding:8px 12px;color:#42639b}.avatar{background:#dce8fa;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:#3565bd}.hero{background:linear-gradient(110deg,#e2efff,#f9fbff 65%,#eae8ff);border:1px solid #dfe8f8;border-radius:22px;padding:34px 37px;margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-75px;top:-120px;width:310px;height:310px;border:52px solid #b3c9f82c;border-radius:50%;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:2px;color:#5d7dcb;font-weight:800}.hero h1{font-size:31px;margin:10px 0;color:#17385f}.hero p{color:#73869f;max-width:750px;line-height:1.9;margin:0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.action,.card{background:#fff;border:1px solid var(--border);border-radius:17px;box-shadow:0 6px 22px #193a6108}.action{display:flex;align-items:center;gap:13px;text-align:left;padding:19px;cursor:pointer}.action:hover{border-color:#9eb9eb}.symbol{background:#e9f1ff;border-radius:12px;width:46px;height:46px;display:grid;place-items:center;font-size:23px;color:#4d79db}.action b{display:block;font-size:13px}.action small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.sectiontitle{font-size:17px;margin:25px 0 15px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.kpi{padding:21px;min-height:130px}.kpi label{font-size:12px;color:#8b9cb1}.kpi strong{display:block;font-size:30px;margin:13px 0 5px}.kpi small{color:#8195aa;font-size:11px}.columns{display:grid;grid-template-columns:1.25fr 1fr;gap:17px}.card{padding:23px}.card h3{font-size:15px;margin:0 0 5px}.sub{color:#91a1b7;font-size:12px;line-height:1.8}.chart{height:210px;display:flex;align-items:end;gap:18px;border-bottom:1px solid #e4ebf5;padding:20px 8px 0;background:repeating-linear-gradient(to top,transparent 0,transparent 48px,#eff3f8 49px)}.barbox{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:8px}.bar{width:65%;background:linear-gradient(#81a7f4,#4779df);border-radius:7px 7px 0 0;min-height:3px}.chartlabels{display:flex;gap:18px;margin-top:12px}.chartlabels span{flex:1;text-align:center;color:#8294ac;font-size:11px}.donut{height:178px;width:178px;border-radius:50%;background:conic-gradient(#4d80e5 0 32%,#77a8ef 32% 56%,#5fc8b0 56% 74%,#f0b77d 74% 89%,#a78fe9 89% 100%);position:relative;flex-shrink:0}.donut:after{content:attr(data-total);position:absolute;inset:43px;background:white;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800}.donutrow{display:flex;align-items:center;gap:28px;min-height:230px}.legend{flex:1;color:#7388a3;font-size:12px}.legend div{display:flex;justify-content:space-between;margin:14px 0;gap:12px}.legend i{width:10px;height:10px;display:inline-block;border-radius:3px;margin-right:8px}.page{display:none}.page.active{display:block}.formgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.field{display:grid;gap:8px;margin-bottom:17px}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select,.search{width:100%;padding:13px 14px;background:#fbfcff;border:1px solid #dfe7f3;border-radius:10px;color:#193a63}.field textarea{min-height:175px;resize:vertical;line-height:1.8}.btn{background:#4777df;border:0;color:#fff;padding:12px 20px;border-radius:10px;font-weight:700}.btn.secondary{background:#eaf1ff;color:#3968cc}.note{background:#f1f6ff;color:#627d9f;border-radius:12px;padding:16px;line-height:1.9;font-size:12px}.ticket{padding:17px;border:1px solid #e5edf7;border-radius:13px;margin:12px 0;background:#fff}.tickethead{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:11px;padding:6px 11px;border-radius:8px;background:#e9f1ff;color:#376bd0}.status.closed{background:#e5f8ef;color:#238660}.timeline{border-left:2px solid #dbe6f7;margin:20px 10px;padding-left:20px}.event{margin:17px 0;position:relative}.event:before{content:'';width:11px;height:11px;border-radius:50%;background:#4777df;position:absolute;left:-26px;top:4px}.event small{color:#8b9bb0}.hide{display:none!important}.footer{color:#9babc0;font-size:11px;margin-top:35px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9dbaf2;outline-offset:2px}body[dir=rtl] .side{border-right:0;border-left:1px solid var(--border)}body[dir=rtl] .nav button,body[dir=rtl] .action{text-align:right}body[dir=rtl] .timeline{border-left:0;border-right:2px solid #dbe6f7;padding-left:0;padding-right:20px}body[dir=rtl] .event:before{left:auto;right:-26px}@media(max-width:1100px){.actions,.kpis{grid-template-columns:repeat(2,1fr)}.columns,.formgrid{grid-template-columns:1fr}.main{padding:23px}}@media(max-width:650px){.shell{display:block}.side{width:100%;position:sticky;top:0;z-index:10;padding:8px 12px;gap:6px}.brand img{width:29px;height:33px}.brand small,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;font-size:11px;padding:10px}.nav button span{width:auto;margin-right:5px}.main{padding:18px 14px}.hero{padding:25px 21px}.hero h1{font-size:24px}.actions{grid-template-columns:1fr 1fr;gap:9px}.action{padding:12px;gap:8px}.symbol{width:34px;height:34px;font-size:17px}.kpis{gap:10px}.kpi{padding:14px}.kpi strong{font-size:23px}.donutrow{flex-wrap:wrap}.card{padding:17px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="/static/logo.jpg" alt="Academy emblem"><div><b>SADAT</b><small>SERVICE QUALITY CENTER</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><b data-i="help">Need assistance?</b><div data-i="helptext">Your feedback helps improve institutional services.</div></div></aside><main class="main"><header class="top"><span id="crumb">Service Center / Overview</span><div class="topright"><button class="lang" id="lang">العربية</button><span class="avatar">S</span></div></header><div id="pages"></div><div class="footer">SADAT · Complaints & Service Quality Center · Reference deployment with local records</div></main></div><script>
const I={en:{home:'Overview',submit:'Submit Complaint',tickets:'My Complaints',staff:'Staff Workspace',management:'Management',feedback:'Feedback',help:'Need assistance?',helptext:'Your feedback helps improve institutional services.',welcome:'INSTITUTIONAL SERVICE EXPERIENCE',title:'Complaints & Service Quality Center',intro:'A clear path from raising a concern to resolution, feedback and continuous service improvement.',new:'New Complaint',newsub:'Tell us what happened',track:'Track Complaint',tracksub:'Follow progress and responses',rate:'Rate Service',ratesub:'Share your experience',reports:'Service Insights',reportssub:'Understand service performance',stats:'Service overview',total:'Total complaints',open:'In progress',closed:'Resolved / closed',rated:'Feedback received',byunit:'Complaints by destination',recent:'Recent activity',name:'Full name',email:'Email address',details:'Describe your complaint',placeholder:'Explain what happened in your own words. You do not need to choose a department.',send:'Submit complaint',what:'What happens next?',whattxt:'Your complaint is saved first. The system then attempts classification using the original trained model. Staff can review and update its progress.',your:'Your complaints',search:'Search by reference or email',find:'Find complaints',stafftitle:'Staff workspace',staffintro:'Review incoming cases, respond, and update their status.',adminpass:'Staff password',login:'Sign in',reply:'Staff response',update:'Save response and status',manage:'Management overview',manageintro:'Operational counts based on stored complaints, not invented data.',feedbacktitle:'Service feedback',feedbackintro:'Rate a closed case using its reference and tracking code.',reference:'Complaint reference',code:'Tracking code',lookup:'Open complaint',rating:'Satisfaction (1–5)',solved:'Was your issue resolved?',comment:'Additional feedback',save:'Submit feedback',status:'Status',unit:'Assigned unit',summary:'Complaint summary',events:'Activity timeline',logout:'Sign out'},ar:{home:'الرئيسية',submit:'تقديم شكوى',tickets:'متابعة الشكاوى',staff:'مساحة الموظف',management:'الإدارة',feedback:'التقييم',help:'تحتاج مساعدة؟',helptext:'ملاحظاتك تساعدنا على تحسين الخدمات.',welcome:'الخدمات المؤسسية',title:'مركز الشكاوى وجودة الخدمات',intro:'رحلة واضحة من تقديم الشكوى إلى معالجتها وقياس الرضا وتحسين الخدمات.',new:'شكوى جديدة',newsub:'احكِ لنا ما حدث',track:'متابعة شكوى',tracksub:'تابع الحالة والردود',rate:'تقييم الخدمة',ratesub:'شاركنا تجربتك',reports:'مؤشرات الخدمات',reportssub:'تعرف على أداء الخدمات',stats:'نظرة عامة على الخدمات',total:'إجمالي الشكاوى',open:'قيد المعالجة',closed:'مغلقة',rated:'تقييمات مستلمة',byunit:'الشكاوى حسب الجهة',recent:'أحدث الأنشطة',name:'الاسم الكامل',email:'البريد الإلكتروني',details:'وصف الشكوى',placeholder:'اكتب المشكلة بطريقتك، مش مطلوب منك تعرف اسم الإدارة.',send:'إرسال الشكوى',what:'ماذا يحدث بعد الإرسال؟',whattxt:'تُحفظ الشكوى أولًا، ثم يحاول النظام تصنيفها باستخدام الموديل الأصلي. يستطيع الموظف مراجعة الطلب وتحديث حالته.',your:'شكاواي',search:'البحث برقم المتابعة أو البريد',find:'بحث',stafftitle:'مساحة الموظف',staffintro:'مراجعة الشكاوى والرد عليها وتحديث حالتها.',adminpass:'كلمة مرور الموظف',login:'دخول',reply:'رد الموظف',update:'حفظ الرد والحالة',manage:'لوحة الإدارة',manageintro:'المؤشرات من الشكاوى المحفوظة، وليست بيانات افتراضية.',feedbacktitle:'تقييم الخدمة',feedbackintro:'قيّم شكوى مغلقة برقم المتابعة والرمز السري.',reference:'رقم المتابعة',code:'رمز المتابعة',lookup:'عرض الشكوى',rating:'الرضا (1–5)',solved:'هل تم حل المشكلة؟',comment:'تعليق إضافي',save:'إرسال التقييم',status:'الحالة',unit:'الجهة',summary:'ملخص الشكوى',events:'سجل الإجراءات',logout:'تسجيل الخروج'}};let lang=localStorage.getItem('sadat_lang')||'en',page='home',staffToken=sessionStorage.getItem('sadat_staff')||'',selected=null;const $=x=>document.querySelector(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=k=>I[lang][k]||k;async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(staffToken?{'X-Staff-Key':staffToken}:{}),...(opt.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}const tile=(icon,title,sub,p)=>`<button class="action" onclick="go('${p}')"><span class="symbol">${icon}</span><span><b>${t(title)}</b><small>${t(sub)}</small></span></button>`;function hero(ey,title,sub){return `<section class="hero"><div class="eyebrow">${t(ey)}</div><h1>${t(title)}</h1><p>${t(sub)}</p></section>`}function nav(){let pages=['home','submit','tickets','feedback','staff','management'],icons=['⌂','✎','▤','☆','▣','▥'];$('#nav').innerHTML=pages.map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${icons[i]}</span>${t(p)}</button>`).join('');$('#crumb').textContent='SADAT / '+t(page);$('#lang').textContent=lang==='en'?'العربية':'English';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i))}function go(p){page=p;nav();draw();window.scrollTo(0,0)}$('#lang').onclick=()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('sadat_lang',lang);go(page)};async function draw(){let h='';if(page==='home'){h=hero('welcome','title','intro')+`<div class="actions">${tile('✎','new','newsub','submit')}${tile('▤','track','tracksub','tickets')}${tile('☆','rate','ratesub','feedback')}${tile('▥','reports','reportssub','management')}</div><h2 class="sectiontitle">${t('stats')}</h2><div id="dash"></div>`}if(page==='submit'){h=hero('new','submit','newsub')+`<div class="formgrid"><section class="card"><form id="complaintform"><div class="field"><label>${t('name')}</label><input name="name" maxlength="100" required></div><div class="field"><label>${t('email')}</label><input name="email" type="email" required></div><div class="field"><label>${t('details')}</label><textarea name="body" minlength="12" maxlength="5000" required placeholder="${t('placeholder')}"></textarea></div><button class="btn">${t('send')}</button></form><div id="receipt"></div></section><aside class="card"><h3>${t('what')}</h3><div class="note">${t('whattxt')}</div></aside></div>`}if(page==='tickets'){h=hero('track','your','tracksub')+`<section class="card"><div class="field"><label>${t('reference')}</label><input id="ref" placeholder="SD-..."></div><div class="field"><label>${t('code')}</label><input id="secret" type="password"></div><button class="btn" onclick="lookup()">${t('lookup')}</button><div id="ticketresult"></div></section>`}if(page==='feedback'){h=hero('rate','feedbacktitle','feedbackintro')+`<section class="card" style="max-width:750px"><form id="rateform"><div class="field"><label>${t('reference')}</label><input name="reference" required></div><div class="field"><label>${t('code')}</label><input name="code" required></div><div class="field"><label>${t('rating')}</label><select name="rating">${[5,4,3,2,1].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${t('solved')}</label><select name="solved"><option value="yes">Yes / نعم</option><option value="partial">Partially / جزئيًا</option><option value="no">No / لا</option></select></div><div class="field"><label>${t('comment')}</label><textarea name="comment" style="min-height:95px"></textarea></div><button class="btn">${t('save')}</button></form><div id="rateout"></div></section>`}if(page==='staff'){h=hero('staff','stafftitle','staffintro')+(staffToken?`<button class="btn secondary" onclick="logout()">${t('logout')}</button><div id="stafflist"></div>`:`<section class="card" style="max-width:500px"><form id="stafflogin"><div class="field"><label>${t('adminpass')}</label><input name="pass" type="password" required></div><button class="btn">${t('login')}</button></form><div id="loginout"></div></section>`)}if(page==='management'){h=hero('reports','manage','manageintro')+`<div id="dash"></div><div class="note" style="margin-top:18px">Operational data shown here is aggregated from local case records. Access control for executive analytics must be configured before institutional deployment.</div>`}$('#pages').innerHTML=`<section class="page active">${h}</section>`;if(['home','management'].includes(page))loadDash();if(page==='submit')$('#complaintform').onsubmit=submitComplaint;if(page==='feedback')$('#rateform').onsubmit=submitRating;if(page==='staff'){if(staffToken)loadStaff();else $('#stafflogin').onsubmit=login}}function notify(id,msg){$(id).innerHTML=`<p class="note" role="status">${esc(msg)}</p>`}async function submitComplaint(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));try{let d=await api('/api/complaints',{method:'POST',body:JSON.stringify(o)});e.target.classList.add('hide');$('#receipt').innerHTML=`<h2>✓ ${lang==='en'?'Complaint received':'تم استلام الشكوى'}</h2><div class="note"><b>${t('reference')}: ${esc(d.reference)}</b><br><b>${t('code')}: ${esc(d.tracking_code)}</b><br>${t('unit')}: ${esc(d.department)}<br>${t('status')}: ${esc(d.status)}<br>${t('summary')}: ${esc(d.summary)}<br><b>${lang==='en'?'Save your tracking code securely.':'احتفظ برمز المتابعة في مكان آمن.'}</b></div><p><button class="btn" onclick="go('tickets')">${t('track')}</button></p>`}catch(err){notify('#receipt',err.message)}}async function lookup(){try{let d=await api('/api/complaints/'+encodeURIComponent($('#ref').value)+'?code='+encodeURIComponent($('#secret').value));$('#ticketresult').innerHTML=`<div class="ticket"><h3>${esc(d.reference)} <span class="status">${esc(d.status)}</span></h3><p>${t('unit')}: ${esc(d.department)}</p><p>${t('summary')}: ${esc(d.summary)}</p><p>${esc(d.body)}</p><h3>${t('events')}</h3><div class="timeline">${d.events.map(x=>`<div class="event"><b>${esc(x.action)}</b><p>${esc(x.note)}</p><small>${esc(x.created_at)}</small></div>`).join('')}</div></div>`}catch(e){notify('#ticketresult',e.message)}}async function submitRating(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));try{let d=await api('/api/feedback',{method:'POST',body:JSON.stringify(o)});notify('#rateout',d.message)}catch(err){notify('#rateout',err.message)}}async function login(e){e.preventDefault();staffToken=new FormData(e.target).get('pass');try{await api('/api/staff/cases');sessionStorage.setItem('sadat_staff',staffToken);go('staff')}catch(err){staffToken='';notify('#loginout',err.message)}}function logout(){staffToken='';sessionStorage.removeItem('sadat_staff');go('staff')}async function loadStaff(){try{let d=await api('/api/staff/cases');$('#stafflist').innerHTML=d.cases.map(x=>`<div class="ticket"><div class="tickethead"><b>${esc(x.reference)}</b><span class="status">${esc(x.status)}</span></div><p>${esc(x.body)}</p><small>${esc(x.department)}</small><div class="field"><label>${t('status')}</label><select id="s${x.id}">${['Received','In progress','Awaiting student','Resolved','Closed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>${t('reply')}</label><textarea id="r${x.id}" style="min-height:90px">${esc(x.staff_reply||'')}</textarea></div><button class="btn" onclick="saveCase(${x.id})">${t('update')}</button></div>`).join('')||'<p class="note">No complaints yet.</p>'}catch(e){notify('#stafflist',e.message)}}async function saveCase(id){try{await api('/api/staff/cases/'+id,{method:'PATCH',body:JSON.stringify({status:$('#s'+id).value,reply:$('#r'+id).value})});loadStaff()}catch(e){alert(e.message)}}async function loadDash(){try{let d=await api('/api/metrics');let m=d.metrics;$('#dash').innerHTML=`<div class="kpis">${[['total',m.total],['open',m.open],['closed',m.closed],['rated',m.rated]].map(([k,v])=>`<div class="card kpi"><label>${t(k)}</label><strong>${v}</strong><small>${lang==='en'?'Recorded cases':'حالات مسجلة'}</small></div>`).join('')}</div><div class="columns" style="margin-top:20px"><div class="card"><h3>${t('stats')}</h3><p class="sub">${lang==='en'?'Recorded cases by status':'الحالات حسب الوضع'}</p><div class="chart">${Object.entries(m.by_status).slice(0,6).map(([k,v])=>`<div class="barbox"><small>${v}</small><div class="bar" style="height:${Math.max(2,v/Math.max(1,m.total)*100)}%"></div></div>`).join('')||'<p class="sub">No data yet</p>'}</div><div class="chartlabels">${Object.keys(m.by_status).slice(0,6).map(k=>`<span>${esc(k)}</span>`).join('')}</div></div><div class="card"><h3>${t('byunit')}</h3><div class="donutrow"><div class="donut" data-total="${m.total}"></div><div class="legend">${Object.entries(m.by_department).map(([k,v],i)=>`<div><span><i style="background:${['#4d80e5','#77a8ef','#5fc8b0','#f0b77d','#a78fe9'][i%5]}"></i>${esc(k)}</span><b>${v}</b></div>`).join('')||'<span>No data yet</span>'}</div></div></div></div>`}catch(e){notify('#dash',e.message)}}nav();draw();</script></body></html>
